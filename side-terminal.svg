<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="100%" stop-color="#120818"/>
    </linearGradient>
    <pattern id="termScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#9d7bff"/>
    </pattern>
  </defs>

  <!-- terminal window -->
  <rect x="4" y="4" width="312" height="312" rx="12" fill="url(#termBg)" stroke="#9d7bff" stroke-width="1.5" opacity="0.95"/>

  <!-- scanline texture -->
  <rect x="4" y="4" width="312" height="312" rx="12" fill="url(#termScan)" opacity="0.05"/>

  <!-- title bar -->
  <rect x="4" y="4" width="312" height="30" rx="12" fill="#1a0f2e"/>
  <rect x="4" y="20" width="312" height="14" fill="#1a0f2e"/>
  <circle cx="24" cy="19" r="5" fill="#ff2079"/>
  <circle cx="42" cy="19" r="5" fill="#9d7bff"/>
  <circle cx="60" cy="19" r="5" fill="#00fff9"/>
  <text x="160.0" y="24" font-family="Courier New, monospace" font-size="11" fill="#9d7bff" text-anchor="middle">yazdaan@dev</text>

  <!-- moving scan bar -->
  <rect x="4" width="312" height="6" fill="#00fff9" opacity="0.06">
    <animate attributeName="y" values="34;310;34" dur="4s" repeatCount="indefinite"/>
  </rect>

  
  <text x="24" y="70" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">$ whoami
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.044;0.061;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="96" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">yazdaan_ali
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.083;0.1;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="122" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">$ init --engine
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.122;0.139;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="148" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">loading modules...
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.161;0.178;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="174" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">[OK] c / cpp / python
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.217;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="200" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">[OK] data_structures
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.239;0.256;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="226" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">[OK] algorithms
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.278;0.294;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="252" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">$ status
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.317;0.333;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="24" y="278" font-family="Courier New, monospace" font-size="14" fill="#00fff9" opacity="0">> building the future_
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.356;0.372;1" dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- blinking cursor after last line -->
  <rect x="145" y="267" width="9" height="14" fill="#00fff9">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- corner accents -->
  <path d="M 4 34 L 4 16 L 22 16" stroke="#00fff9" stroke-width="0" fill="none"/>
</svg>
