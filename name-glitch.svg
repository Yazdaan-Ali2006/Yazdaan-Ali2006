<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170">
  <defs>
    <style>
      .name { font-family: 'Courier New', monospace; font-weight: bold; font-size: 44px; }
      .title { font-family: 'Courier New', monospace; font-weight: bold; font-size: 20px; letter-spacing: 1px; }
    </style>
    <clipPath id="nclipA">
      <rect x="0" y="0" width="900" height="14"/>
      <rect x="0" y="34" width="900" height="8"/>
      <rect x="0" y="66" width="900" height="16"/>
      <rect x="0" y="110" width="900" height="10"/>
    </clipPath>
    <clipPath id="nclipB">
      <rect x="0" y="18" width="900" height="10"/>
      <rect x="0" y="48" width="900" height="12"/>
      <rect x="0" y="82" width="900" height="8"/>
      <rect x="0" y="125" width="900" height="14"/>
    </clipPath>
    <pattern id="nscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ffe1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="170" fill="#050507"/>
  <g opacity="0.12">
    <rect x="0" y="0" width="900" height="170" fill="url(#nscan)"/>
  </g>

  <!-- moving scan bar -->
  <rect x="0" width="900" height="6" fill="#00ffe1" opacity="0.08">
    <animate attributeName="y" values="0;170;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- CYAN ghost -->
  <g fill="#00fff9" clip-path="url(#nclipA)">
    <text x="30" y="70" class="name">Yazdaan Ali Mirza</text>
    <text x="30" y="115" class="title">COMPUTER SYSTEMS ENGINEER</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -4 0; 3 0; -2 0; 0 0; 4 0; 0 0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"
      dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- MAGENTA ghost -->
  <g fill="#ff2079" clip-path="url(#nclipB)">
    <text x="30" y="70" class="name">Yazdaan Ali Mirza</text>
    <text x="30" y="115" class="title">COMPUTER SYSTEMS ENGINEER</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 4 0; -3 0; 2 0; 0 0; -4 0; 0 0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"
      dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- MAIN neon text -->
  <g fill="#f5f5f5">
    <text x="30" y="70" class="name">Yazdaan Ali Mirza</text>
    <text x="30" y="115" class="title" fill="#00fff9">COMPUTER SYSTEMS ENGINEER</text>
    <animate attributeName="opacity" values="1;1;0.55;1;1;0.65;1" keyTimes="0;0.2;0.22;0.4;0.75;0.77;1" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- underline flicker -->
  <rect x="30" y="128" width="0" height="3" fill="#ff2079">
    <animate attributeName="width" values="0;450;450;0;0" keyTimes="0;0.3;0.7;0.85;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- random flicker bars -->
  <g fill="#00fff9">
    <rect x="0" y="45" width="900" height="4" opacity="0">
      <animate attributeName="opacity" values="0;0;0.6;0;0;0" keyTimes="0;0.31;0.33;0.35;0.7;1" dur="2.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="100" width="900" height="6" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.5;0;0" keyTimes="0;0.55;0.57;0.59;0.6;1" dur="2.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
