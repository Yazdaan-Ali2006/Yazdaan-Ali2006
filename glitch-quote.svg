<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <style>
      .glitch-base { font-family: 'Courier New', monospace; font-weight: bold; font-size: 22px; }
      .line1 { }
      .line2 { }
    </style>
    <clipPath id="clipA">
      <rect x="0" y="0" width="900" height="10"/>
      <rect x="0" y="28" width="900" height="6"/>
      <rect x="0" y="55" width="900" height="14"/>
      <rect x="0" y="90" width="900" height="8"/>
    </clipPath>
    <clipPath id="clipB">
      <rect x="0" y="12" width="900" height="8"/>
      <rect x="0" y="40" width="900" height="10"/>
      <rect x="0" y="70" width="900" height="6"/>
      <rect x="0" y="105" width="900" height="12"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="160" fill="#050507"/>

  <!-- scanlines -->
  <g opacity="0.15">
    <rect x="0" y="0" width="900" height="160" fill="url(#scan)"/>
  </g>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#00ffe1"/>
    </pattern>
  </defs>

  <!-- moving scan bar -->
  <rect x="0" width="900" height="6" fill="#00ffe1" opacity="0.08">
    <animate attributeName="y" values="0;160;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- CYAN ghost layer -->
  <g fill="#00fff9" class="glitch-base" clip-path="url(#clipA)">
    <text x="34" y="60">Hard work never killed anyone.</text>
    <text x="34" y="100">Regret has buried more dreams than effort ever did.</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -3 0; 2 0; -2 0; 0 0; 3 0; 0 0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"
      dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- MAGENTA/RED ghost layer -->
  <g fill="#ff2079" class="glitch-base" clip-path="url(#clipB)">
    <text x="34" y="60">Hard work never killed anyone.</text>
    <text x="34" y="100">Regret has buried more dreams than effort ever did.</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 3 0; -2 0; 2 0; 0 0; -3 0; 0 0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"
      dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- MAIN white/neon text -->
  <g fill="#f5f5f5" class="glitch-base">
    <text x="34" y="60">Hard work never killed anyone.</text>
    <text x="34" y="100">Regret has buried more dreams than effort ever did.</text>
    <animate attributeName="opacity" values="1;1;0.6;1;1;0.7;1" keyTimes="0;0.2;0.22;0.4;0.75;0.77;1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- random flicker overlay bars -->
  <g fill="#00fff9" opacity="0">
    <rect x="0" y="45" width="900" height="4">
      <animate attributeName="opacity" values="0;0;0.6;0;0;0" keyTimes="0;0.31;0.33;0.35;0.7;1" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="85" width="900" height="6">
      <animate attributeName="opacity" values="0;0;0;0.5;0;0" keyTimes="0;0.55;0.57;0.59;0.6;1" dur="2.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
