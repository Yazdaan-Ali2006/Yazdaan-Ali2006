<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 210" width="750" height="210">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; font-weight: bold; font-size: 20px; }
    </style>
    <clipPath id="typClipA">
      <rect x="0" y="4" width="750" height="12"/><rect x="0" y="38" width="750" height="12"/><rect x="0" y="72" width="750" height="12"/><rect x="0" y="106" width="750" height="12"/><rect x="0" y="140" width="750" height="12"/>
    </clipPath>
    <clipPath id="typClipB">
      <rect x="0" y="18" width="750" height="9"/><rect x="0" y="52" width="750" height="9"/><rect x="0" y="86" width="750" height="9"/><rect x="0" y="120" width="750" height="9"/><rect x="0" y="154" width="750" height="9"/>
    </clipPath>
  </defs>

  <!-- cyan ghost -->
  <g clip-path="url(#typClipA)" fill="#00fff9">
    <text x="10" y="26" fill="#00fff9">Computer Information Systems Undergraduate</text>
    <text x="10" y="60" fill="#00fff9">C++ | Python | C</text>
    <text x="10" y="94" fill="#00fff9">Problem Solver</text>
    <text x="10" y="128" fill="#00fff9">Passionate About Software Engineering</text>
    <text x="10" y="162" fill="#00fff9">Always Learning New Technologies</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -3 0; 2 0; -2 0; 0 0; 3 0; 0 0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"
      dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- magenta ghost -->
  <g clip-path="url(#typClipB)" fill="#ff2079">
    <text x="10" y="26" fill="#ff2079">Computer Information Systems Undergraduate</text>
    <text x="10" y="60" fill="#ff2079">C++ | Python | C</text>
    <text x="10" y="94" fill="#ff2079">Problem Solver</text>
    <text x="10" y="128" fill="#ff2079">Passionate About Software Engineering</text>
    <text x="10" y="162" fill="#ff2079">Always Learning New Technologies</text>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 3 0; -2 0; 2 0; 0 0; -3 0; 0 0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.8;1"
      dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- main text -->
  <g fill="#9d7bff">
    <text x="10" y="26" fill="#9d7bff">Computer Information Systems Undergraduate</text>
    <text x="10" y="60" fill="#9d7bff">C++ | Python | C</text>
    <text x="10" y="94" fill="#9d7bff">Problem Solver</text>
    <text x="10" y="128" fill="#9d7bff">Passionate About Software Engineering</text>
    <text x="10" y="162" fill="#9d7bff">Always Learning New Technologies</text>
    <animate attributeName="opacity" values="1;1;0.6;1;1;0.7;1" keyTimes="0;0.2;0.22;0.4;0.75;0.77;1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- flicker bars -->
  <g>
    <rect x="0" y="46" width="750" height="4" fill="#00fff9" opacity="0">
      <animate attributeName="opacity" values="0;0;0.6;0;0;0" keyTimes="0;0.31;0.33;0.35;0.7;1" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="114" width="750" height="5" fill="#ff2079" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.5;0;0" keyTimes="0;0.55;0.57;0.59;0.6;1" dur="2.7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
